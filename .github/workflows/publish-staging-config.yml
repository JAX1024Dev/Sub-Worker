name: Publish staging configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - example/sing-box/common/**
      - example/sing-box/dns/**
      - example/sing-box/outbounds/**
      - example/sing-box/platforms/**
      - example/sing-box/profiles/**
      - example/sing-box/published/**
      - example/sing-box/rules/**
      - example/sing-box/schema/**

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: publish-staging-configuration
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: configuration-staging

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and publish manifest
        run: |
          bundle_commit=$(git rev-parse HEAD)
          echo "BUNDLE_COMMIT=$bundle_commit" >> "$GITHUB_ENV"
          pnpm config:validate
          pnpm config:diff
          pnpm config:publish:staging -- "$bundle_commit"
          pnpm config:channels:check
      - name: Create staging promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- example/sing-box/channels/staging.json; then
            echo "Staging manifest is already current."
            exit 0
          fi
          branch="config/staging-${BUNDLE_COMMIT:0:12}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add example/sing-box/channels/staging.json
          git commit -m "chore(config): publish staging bundle"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(config): publish staging bundle" \
            --body "Publishes the verified sing-box bundles from commit \`$BUNDLE_COMMIT\` to the staging channel."
          gh workflow run ci.yml --ref "$branch"
